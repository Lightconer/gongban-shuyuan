name: 自动校验与更新书源

on:
  schedule:
    - cron: "30 2 * * *" # 每天 10:30（UTC+8）自动校验
  workflow_dispatch: # 也支持在 Actions 页手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 自动校验书源（生成 sources.json / 书单.md）
        run: python scripts/validate.py

      - name: 提交并推送更新（仅在状态有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json 书单.md
          if git diff --cached --quiet; then
            echo "书源状态无变化，跳过提交"
          else
            git commit -m "auto: 书源状态自动校验 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
